apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "upf-loadtest-webui.fullname" . }}
rules:
  - apiGroups: ["", "apps", "batch", "rbac.authorization.k8s.io", "k8s.cni.cncf.io", "monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "upf-loadtest-webui.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "upf-loadtest-webui.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "upf-loadtest-webui.fullname" . }}
    namespace: {{ .Release.Namespace }}

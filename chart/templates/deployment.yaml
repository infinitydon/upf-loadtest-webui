apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "upf-loadtest-webui.fullname" . }}
  labels:
    {{- include "upf-loadtest-webui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "upf-loadtest-webui.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "upf-loadtest-webui.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "upf-loadtest-webui.fullname" . }}
      containers:
        - name: webui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME
              value: /tmp
            - name: HELM_CACHE_HOME
              value: /tmp/helm/cache
            - name: HELM_CONFIG_HOME
              value: /tmp/helm/config
            - name: HELM_DATA_HOME
              value: /tmp/helm/data
            - name: DEFAULT_RELEASE
              value: {{ .Values.defaults.release | quote }}
            - name: DEFAULT_NAMESPACE
              value: {{ .Values.defaults.namespace | quote }}
            - name: WORKLOAD_CHART_VERSION
              value: {{ .Values.defaults.chartVersion | quote }}
            - name: WORKLOAD_MONITORING_ENABLED
              value: {{ .Values.defaults.monitoringEnabled | quote }}
            - name: TREX_IMAGE
              value: {{ .Values.trex.image | quote }}
            - name: TREX_INSTALL_DIR
              value: {{ .Values.trex.installDir | quote }}
            {{- if or .Values.auth.existingSecret .Values.auth.token }}
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "upf-loadtest-webui.fullname" .) .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKey }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
